<div class="w-full overflow-x-auto"><table ><thead><tr><th class="text-right tabular-nums">#</th><th>Asset</th><th class="text-right tabular-nums">Price</th><th class="text-right tabular-nums">Change</th><th class="text-right tabular-nums">30 days</th><th class="text-right tabular-nums">Trend</th></tr></thead><tbody>{% for row in rows %}<tr><td class="text-right tabular-nums text-muted">{{ row.rank }}</td><th><strong>{{ row.ticker }}</strong><span class="mt-1 block text-xs font-normal text-muted">{{ row.name }}</span></th><td class="text-right tabular-nums">${{ row.price_display }}<span class="mt-1 block text-xs text-muted">{{ row.date|date:'d M' }}</span></td><td class="text-right tabular-nums {% if row.change >= 0 %}text-positive{% else %}text-negative{% endif %}"><span title="{{ row.previous_date|date:'d M Y' }} to {{ row.date|date:'d M Y' }}">{{ row.change|floatformat:2 }}%</span></td><td class="text-right tabular-nums {% if row.momentum >= 0 %}text-positive{% else %}text-negative{% endif %}">{{ row.momentum|floatformat:2 }}%</td><td class="text-right tabular-nums"><svg class="sparkline" viewBox="0 0 130 36" role="img" aria-label="{{ row.name }} recent price trend"><polyline points="{{ row.points }}" fill="none" stroke="{% if row.momentum >= 0 %}#24714c{% else %}#ad4941{% endif %}" stroke-width="2" vector-effect="non-scaling-stroke" /></svg></td></tr>{% endfor %}</tbody></table></div>
